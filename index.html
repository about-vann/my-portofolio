    <script>
      (function () {
        try {
          history.scrollRestoration = "manual";
          var savedMode = localStorage.getItem("portfolio_color_mode");
          document.documentElement.classList.toggle("light-mode", savedMode === "light");
          document.documentElement.classList.toggle("dark", savedMode !== "light");
          window.scrollTo(0, 0);
        } catch (_) {}
      })();
    </script>
