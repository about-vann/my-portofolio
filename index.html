<!doctype html>
<html lang="id" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ignmasvikk - Portfolio</title>
    <meta name="description" content="Portofolio Muhammad Fikri (Ignmasvikk) - Web & Bot Developer dari Surabaya yang berfokus membangun web modern dan WhatsApp Bot." />
    <meta property="og:title" content="Ignmasvikk - Portfolio" />
    <meta property="og:description" content="Portofolio Muhammad Fikri (Ignmasvikk) - Web & Bot Developer dari Surabaya yang berfokus membangun web modern dan WhatsApp Bot." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Sedgwick+Ave+Display&family=JetBrains+Mono:wght@300;400;500&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          if (window.location.hash) {
            history.replaceState(null, '', window.location.pathname);
          }
          window.scrollTo(0, 0);
          var savedMode = localStorage.getItem("portfolio_color_mode");
          document.documentElement.classList.toggle("light-mode", savedMode === "light");
          document.documentElement.classList.toggle("dark", savedMode !== "light");
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-[#0e1015] text-zinc-100 font-['Poppins',sans-serif] antialiased selection:bg-white/20 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
